[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rca"
version = "0.1.1"
description = "房屋租赁合同审计器（租客视角）——把分散在民法典与城市条例里的数值规则做成可核验的合同体检，每条判定挂法条原文锚点"
readme = "README.md"
requires-python = ">=3.12"
# SPDX 字符串（PEP 639）。TOML 表形态已弃用，setuptools 84 给出硬期限 2027-02-18。
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["rental", "contract", "audit", "compliance", "legal"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
]
# 核心层零第三方依赖（纯 stdlib）——`pip install -e .` 即可跑 CLI
dependencies = []

[project.optional-dependencies]
# GUI 桌面形态（floor 已是 3.12，不再需要为老解释器钉 PySide6 上限）
gui = ["PySide6>=6.6"]
# 报告导出无需 extra：XLSX 走自写最小 OOXML writer（保字节确定）
report = []
# 测试期依赖：测试套件真 import 的库必须在此（"测试面 = 安装面"）
dev = ["pytest>=7,<9", "pyyaml>=6"]
# 构建工具单列，不进运行时安装面；setuptools<81：PyInstaller 仍 import pkg_resources，81 起移除
build = ["pyinstaller>=6", "setuptools<81"]

[project.scripts]
rca = "rca.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# 数据必须随包走，否则 `pip install <wheel>` 后 `rca rules` / `rca bench` 会
# 直接 exit 2（"未找到 data/ 目录"）——editable 安装看不出这个问题。
# 集合与 `rca.packaging.WHITELIST` 一致（`tools/check_package_data.py` 与
# `tests/test_install_smoke.py` 守门）；官方全文快照 `data/knowledge/raw/`
# 留在仓库根，**不进包**（版权红线）。
[tool.setuptools.package-data]
rca = [
  "data/rules/*.json",
  "data/samples/*.json",
  "data/samples/*.txt",
  "data/knowledge/MANIFEST.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
