name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: "test (${{ matrix.os }} / py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.12"]
        exclude:
          # ubuntu 新镜像对 py3.8 支持存疑；旧解释器只在 windows 守
          - os: ubuntu-latest
            python-version: "3.8"

    env:
      # 编码三层加固的第一层：覆盖本 job 的全部步骤
      # （另两层在代码里：入口 _ensure_utf8_stdio / 子进程显式 encoding=）
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 脱敏审计的历史扫描依赖全量历史；浅克隆会静默削弱成空验
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install package with test and GUI extras
        # 测试面 = 安装面：测试套件真 import 的库（pytest / PyYAML / PySide6）
        # 必须在这一条安装通路的 extras 里，否则干净环境硬失败
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      - name: Run full test suite
        run: python -m pytest -q -rs

      - name: Freeze checks (generators must reproduce byte-identically)
        run: |
          python tools/fetch_sources.py --check
          python tools/gen_rulesets.py --check
          python tools/gen_samples.py --check

      - name: Zero policy-literal gate
        run: |
          python tools/check_literals.py
          python tools/check_literals.py --selftest

      - name: Desensitization audit
        run: |
          python tools/audit_desensitize.py selftest
          python tools/audit_desensitize.py tracked

      - name: Benchmarks (all suites must meet manifest thresholds)
        run: python -m rca.cli bench

      - name: CLI contract smoke
        shell: bash
        run: |
          python -m rca.cli rules --city 北京
          python -m rca.cli selftest --out selftest.json
          test -s selftest.json
